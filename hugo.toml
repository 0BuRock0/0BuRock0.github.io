baseURL = "https://0BuRock0.github.io/"
title   = "Portfolio"
languageCode = "en-us"
theme = "hello-friend-ng"

PygmentsCodeFences = true
PygmentsStyle = "monokai"

#buildDrafts  = false#
canonifyURLs = true

enableRobotsTXT = true
enableGitInfo   = false
enableEmoji     = true

[permalinks]
  writeups = "/writeups/:year/:month/:title/"  
  projects = "/projects/:title/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hrefTargetBlank = true

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  description = "My Portfolio Page"
  keywords = "cybersecurity, writeups, EEE"
  images = [""]

  homeSubtitle = "Hello Friend NG"
  disableReadOtherPosts = false

  # --- TEMA SEÇENEKLERİ (THEME OPTIONS) ---
  enableThemeToggle = true
  # Seçenekler: "orange", "blue", "red", "green", "pink"
  themeColor = "blue" 
  
  enableSharingButtons = true
  enableReadingTime = true
  enableGlobalLanguageMenu = false

  customCSS = []
  customJS  = []

  [params.author]
    name = "Burak"

  [params.footer]
    trademark = 2026
    rss = true
    copyright = true
    author = true

    topText = []
    bottomText = [
      "Powered by <a href=\"http://gohugo.io\">Hugo</a>",
      "Made with &#10084; by <a href=\"https://github.com/rhazdon\">Djordje Atlialp</a>"
    ]

  [params.favicon.color]
    mask = "#1b1c1d"
    msapplication = "#1b1c1d"
    theme = "#1b1c1d"

  [params.logo]
    logoMark     = ">"
    logoText     = "$ cd /home"
    logoHomeLink = "/"

  # --- SOSYAL MEDYA HESAPLARI ---
  [[params.social]]
    name = "github"
    url  = "https://github.com/"

  [[params.social]]
    name = "linkedin"
    url  = "https://www.linkedin.com/"

  [[params.social]]
    name = "email"
    url  = "mailto:nobody@example.com"

[menu]
  [[menu.main]]
    identifier = "whoami"
    name       = "whoami"
    url        = "/whoami/"
    weight     = 1 # Menüdeki sırası (1. sırada)

  [[menu.main]]
    identifier = "projects"
    name       = "projects"
    url        = "/projects/"
    weight     = 2  # Menüdeki sırası (2. sırada)

  [[menu.main]]
    identifier = "writeups"
    name       = "writeups"
    url        = "/writeups/"
    weight     = 3  # Menüdeki sırası (3. sırada)